name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest đã có sẵn Android SDK. Chỉ cần accept licenses tự động.
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Đảm bảo NDK 26.1.10909125 sẵn sàng, tái sử dụng NDK 26 có sẵn trên runner tránh lỗi tải hỏng file zip
      - name: Setup Android NDK
        run: |
          rm -rf $ANDROID_HOME/.temp || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            PREINSTALLED=$(ls -d $ANDROID_HOME/ndk/26.* 2>/dev/null | head -n 1)
            if [ -n "$PREINSTALLED" ]; then
              echo "Tái sử dụng NDK có sẵn: $PREINSTALLED -> 26.1.10909125"
              ln -s "$PREINSTALLED" "$ANDROID_HOME/ndk/26.1.10909125"
            else
              echo "Cài đặt NDK qua sdkmanager..."
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" || true
            fi
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # APK debug: chạy được ngay, không cần keystore, dùng để test nhanh.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CayXu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # APK release: chỉ build nếu đã khai báo đủ 4 secret keystore bên dưới.
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CayXu-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Tự động đọc versionCode & versionName từ file cấu hình Gradle để sinh version.json
      - name: Generate version.json
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="app/build.gradle"
          fi
          V_CODE=$(grep -E 'versionCode\s*=' "$GRADLE_FILE" | grep -oE '[0-9]+' | head -n 1)
          V_NAME=$(sed -n -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n 1)
          echo "Detected versionCode: $V_CODE, versionName: $V_NAME"
          printf '{\n  "version_code": %s,\n  "version_name": "%s",\n  "download_url": "https://github.com/theanh39/lunexapk/raw/main/app-release.apk",\n  "changelog": "- Cập nhật phiên bản mới",\n  "force_update": false\n}\n' "${V_CODE:-1}" "${V_NAME:-1.0.0}" > version.json
          cat version.json

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: version.json

