name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest đã có sẵn Android SDK. Chỉ cần accept licenses tự động.
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Đảm bảo NDK 26.1.10909125 sẵn sàng, tái sử dụng NDK 26 có sẵn trên runner tránh lỗi tải hỏng file zip
      - name: Setup Android NDK
        run: |
          rm -rf $ANDROID_HOME/.temp || true
          if [ ! -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            PREINSTALLED=$(ls -d $ANDROID_HOME/ndk/26.* 2>/dev/null | head -n 1)
            if [ -n "$PREINSTALLED" ]; then
              echo "Tái sử dụng NDK có sẵn: $PREINSTALLED -> 26.1.10909125"
              ln -s "$PREINSTALLED" "$ANDROID_HOME/ndk/26.1.10909125"
            else
              echo "Cài đặt NDK qua sdkmanager..."
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" || true
            fi
          fi

      # Đảm bảo CMake 3.22.1 sẵn sàng, tái sử dụng hoặc cài đặt trước qua sdkmanager tránh lỗi tải hỏng file zip
      - name: Setup Android CMake
        run: |
          rm -rf $ANDROID_HOME/.temp || true
          rm -rf $ANDROID_HOME/cmake/.temp || true
          mkdir -p $ANDROID_HOME/cmake
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            PREINSTALLED_CMAKE=$(ls -d $ANDROID_HOME/cmake/3.22.* 2>/dev/null | head -n 1)
            if [ -n "$PREINSTALLED_CMAKE" ]; then
              echo "Tái sử dụng CMake có sẵn: $PREINSTALLED_CMAKE -> 3.22.1"
              ln -s "$PREINSTALLED_CMAKE" "$ANDROID_HOME/cmake/3.22.1"
            else
              echo "Cài đặt CMake 3.22.1 qua sdkmanager..."
              yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" || true
            fi
          fi
          # Fallback 1: Nếu sdkmanager chưa tạo được 3.22.1, kiểm tra xem có thư mục 3.* nào khác trong sdk không
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ]; then
            ANY_CMAKE=$(ls -d $ANDROID_HOME/cmake/3.* 2>/dev/null | head -n 1)
            if [ -n "$ANY_CMAKE" ]; then
              echo "Symlink CMake từ: $ANY_CMAKE -> 3.22.1"
              ln -s "$ANY_CMAKE" "$ANDROID_HOME/cmake/3.22.1"
            fi
          fi
          # Fallback 2: Nếu vẫn chưa có, symlink từ system cmake trên runner Linux
          if [ ! -d "$ANDROID_HOME/cmake/3.22.1" ] || [ ! -f "$ANDROID_HOME/cmake/3.22.1/bin/cmake" ]; then
            SYS_CMAKE=$(which cmake || true)
            if [ -n "$SYS_CMAKE" ]; then
              echo "Tạo symlink từ system cmake: $SYS_CMAKE -> $ANDROID_HOME/cmake/3.22.1/bin/cmake"
              mkdir -p "$ANDROID_HOME/cmake/3.22.1/bin"
              ln -sf "$SYS_CMAKE" "$ANDROID_HOME/cmake/3.22.1/bin/cmake"
              SYS_NINJA=$(which ninja || true)
              if [ -n "$SYS_NINJA" ]; then
                ln -sf "$SYS_NINJA" "$ANDROID_HOME/cmake/3.22.1/bin/ninja"
              fi
            fi
          fi
          echo "Kiểm tra CMake 3.22.1:"
          ls -la $ANDROID_HOME/cmake/3.22.1/bin || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # APK debug: chạy được ngay, không cần keystore, dùng để test nhanh.
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CayXu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # APK release: chỉ build nếu đã khai báo đủ 4 secret keystore bên dưới.
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CayXu-release-apk
          path: app/build/outputs/apk/release/*.apk

      # Tự động đọc versionCode & versionName từ file cấu hình Gradle để sinh version.json
      - name: Generate version.json
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="app/build.gradle"
          fi
          V_CODE=$(grep -E 'versionCode\s*=' "$GRADLE_FILE" | grep -oE '[0-9]+' | head -n 1)
          V_NAME=$(sed -n -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n 1)
          V_LOG=$(sed -n -E 's/.*UPDATE_CHANGELOG\s*,\s*"\\?"([^"\\]+).*/\1/p' "$GRADLE_FILE" | head -n 1)
          if [ -z "$V_LOG" ] && [ -f "version.json" ]; then
            V_LOG=$(grep -oE '"changelog":\s*"[^"]+"' version.json | sed -E 's/"changelog":\s*"([^"]+)"/\1/')
          fi
          V_LOG=${V_LOG:-"fix lỗi đăng nhập tuongtaccheo"}
          echo "Detected versionCode: $V_CODE, versionName: $V_NAME, changelog: $V_LOG"
          printf '{\n  "version_code": %s,\n  "version_name": "%s",\n  "download_url": "https://github.com/theanh39/lunexapk/raw/main/app-release.apk",\n  "changelog": "%s",\n  "force_update": true\n}\n' "${V_CODE:-1}" "${V_NAME:-1.0.0}" "$V_LOG" > version.json
          cat version.json

      - name: Upload version info
        uses: actions/upload-artifact@v4
        with:
          name: version-info
          path: version.json

