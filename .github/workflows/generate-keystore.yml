name: 1 - Generate Release Keystore (chỉ chạy 1 lần)

on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias cayxu \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "CayXu@2026Secure!" -keypass "CayXu@2026Secure!" \
            -dname "CN=CayXu, OU=CayXu, O=CayXu, L=HoChiMinh, ST=HoChiMinh, C=VN"
          base64 -w0 release.keystore > release.keystore.base64
          echo "Da tao xong keystore."

      - name: Upload keystore (TẢI VỀ RỒI XOÁ ARTIFACT NÀY NGAY)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-DELETE-AFTER-DOWNLOAD
          path: |
            release.keystore
            release.keystore.base64
          retention-days: 1
